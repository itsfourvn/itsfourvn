name: Update README

on:
  schedule:
    - cron: "0 */6 * * *" # Tự động chạy mỗi 6 tiếng
  workflow_dispatch:      # Cho phép bấm chạy thủ công ở tab Actions

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generation scripts
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python github_stats.py
          python generate_images.py
          python update_activity.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 Update README stats and recent activity automatically"
          file_pattern: README.md generated/*
          # Thêm dòng này để tự động rebase/pull code mới nhất trước khi push tránh bị từ chối
          skip_fetch: false
